<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinMate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body class="auth-body" data-bs-theme="dark">
<div class="auth-form-container text-center">

    <img src="/static/img/finmatelogo1.png" alt="Logo" class="logo mb-4" width="100">
    <h4 class="mb-4">Please login</h4>

    <div id="status_message" class="text-danger mb-3"></div>

    <form id="loginForm" novalidate>

        <div class="form-floating mb-3">
            <input type="email" id="email" class="form-control" placeholder="Email" required>
            <label for="email">Email</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <label for="password">Password</label>
        </div>

        <button type="submit" class="w-100 btn btn-lg btn-outline-primary">Login</button>

        <p class="mt-4 mb-1 text-muted">Don't have an account? <a href="/registration.html">Sign up</a></p>
    </form>
</div>

<script type="module" src="/static/js/auth_api.js" defer></script>

<script type="module">
    import { handleLogin } from '/static/js/auth_api.js';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusDiv = document.getElementById('status_message');

        statusDiv.textContent = '';

        try {
            await handleLogin(email, password);
            window.location.href = '/dashboard.html';
        } catch (error) {
            statusDiv.textContent = `Error: ${error.message}`;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
