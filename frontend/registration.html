<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FinMate</title>
    <script> document.documentElement.setAttribute('data-bs-theme', 'dark'); </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">

    <style>
        /* Стилі для коректного відображення */
        .form-floating .invalid-feedback { display: block; height: auto; margin-top: -1.25rem; margin-bottom: 1rem; font-size: .875em; }
    </style>
</head>
<body class="auth-body">
<div class="auth-form-container text-center">
    <img src="/static/img/finmatelogo1.png" alt="Logo" class="mb-4" width="100">
    <h4 class="mb-4">Create an account</h4>

    <div id="status_message" class="text-danger mb-3"></div>

    <form id="registerForm" novalidate>
        <div class="form-floating mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username" required>
            <label for="username">Username</label>
        </div>

        <div class="form-floating mb-3">
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            <label for="email">Email</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <label for="password">Password</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" id="confirm_password" class="form-control" placeholder="Confirm Password" required>
            <label for="confirm_password">Confirm Password</label>
        </div>

        <button type="submit" class="w-100 btn btn-lg btn-outline-primary">Sign up</button>

        <p class="mt-4 mb-1 text-muted">Already have an account? <a href="/login.html">Login</a></p>
    </form>
</div>

<script type="module" src="/static/js/auth_api.js" defer></script>

<script type="module">
    // 5. Імпортуємо функцію реєстрації з нашої "чорної скриньки"
    import { handleRegister } from '/static/js/auth_api.js';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Збираємо дані
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const statusDiv = document.getElementById('status_message');

        statusDiv.textContent = '';

        try {
            await handleRegister(username, email, password, confirmPassword);
            // Успіх: перенаправляємо на сторінку логіну
            window.location.href = '/login.html';
        } catch (error) {
            statusDiv.textContent = `Помилка: ${error.message}`;
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
