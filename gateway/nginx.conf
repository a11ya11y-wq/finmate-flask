server {
    listen 80;
    server_name fin-mate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fin-mate.app;

    ssl_certificate /etc/letsencrypt/live/fin-mate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin-mate.app/privkey.pem;

    # Вказуємо внутрішній DNS-сервер Docker
    resolver 127.0.0.11 valid=10s;

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        set $api_upstream http://api-main:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}