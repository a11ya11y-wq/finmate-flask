server {
    listen 80;
    server_name fin-mate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fin-mate.app;

    ssl_certificate /etc/letsencrypt/live/fin-mate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin-mate.app/privkey.pem;

    location / {
        proxy_pass http://finmate_frontend:80;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://api-main:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}