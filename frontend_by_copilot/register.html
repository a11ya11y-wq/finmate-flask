<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="stylesheet" href="/static/css/auth.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - FinMate</title>
  <link rel="icon" href="/favicon.png">
  <!-- Styles imported via modules -->
  <script type="module">
    import 'bootstrap/dist/css/bootstrap.min.css'
    import 'bootstrap-icons/font/bootstrap-icons.css'
    import '/src/styles/main.css'
    import '/src/styles/auth.css'
  </script>
</head>
<body class="auth-body">
  <div class="auth-background">
    <div class="auth-shape auth-shape-1"></div>
    <div class="auth-shape auth-shape-2"></div>
    <div class="auth-shape auth-shape-3"></div>
  </div>

  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-11 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="auth-card">
          <div class="auth-card-header text-center">
            <img src="/img/finmatelogo1.png" alt="FinMate Logo" class="auth-logo mb-3" width="80" height="80">
            <h2 class="auth-title mb-2">Create Account</h2>
            <p class="auth-subtitle text-muted">Join FinMate and start managing your finances</p>
          </div>

          <div class="auth-card-body">
            <div id="status_message" class="alert alert-danger alert-dismissible fade show d-none text-break" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span class="status-text"></span>
              <button type="button" class="btn-close" onclick="document.getElementById('status_message').classList.add('d-none')"></button>
            </div>

            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">
                  <i class="bi bi-person me-1"></i> Username
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0">
                    <i class="bi bi-person-circle"></i>
                  </span>
                  <input type="text" id="username" class="form-control border-start-0 ps-0" placeholder="Choose a username" required autocomplete="username">
                </div>
                <small class="form-text text-muted">
                  <i class="bi bi-info-circle me-1"></i> 3-20 characters, letters and numbers only
                </small>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">
                  <i class="bi bi-envelope me-1"></i> Email Address
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0">
                    <i class="bi bi-at"></i>
                  </span>
                  <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="your.email@example.com" required autocomplete="email">
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">
                  <i class="bi bi-lock me-1"></i> Password
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0">
                    <i class="bi bi-key"></i>
                  </span>
                  <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-0 password-strength-input" placeholder="Create a strong password" required autocomplete="new-password">
                  <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" tabindex="-1" data-target="password">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="password-strength-bar mt-2">
                  <div class="password-strength-progress"></div>
                </div>
                <small class="form-text text-muted password-strength-text">
                  <i class="bi bi-info-circle me-1"></i> At least 8 characters
                </small>
              </div>

              <div class="mb-3">
                <label for="confirm_password" class="form-label">
                  <i class="bi bi-lock-fill me-1"></i> Confirm Password
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0">
                    <i class="bi bi-shield-check"></i>
                  </span>
                  <input type="password" id="confirm_password" class="form-control border-start-0 border-end-0 ps-0" placeholder="Repeat your password" required autocomplete="new-password">
                  <button class="btn btn-outline-secondary border-start-0 toggle-password" type="button" tabindex="-1" data-target="confirm_password">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small" for="terms">
                  I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
              </div>

              <button type="submit" class="btn btn-success w-100 btn-lg mb-3 auth-submit-btn">
                <span class="btn-text">Create Account</span>
                <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
              </button>

              <div class="text-center">
                <p class="text-muted mb-0">
                  Already have an account?
                  <a href="/login.html" class="text-decoration-none fw-semibold">Sign in</a>
                </p>
              </div>
            </form>
          </div>

          <div class="auth-card-footer text-center">
            <p class="small text-muted mb-0">
              <i class="bi bi-shield-check me-1"></i> Your data is secure with us
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/auth/register.js"></script>
  <script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
      });
    });

    // Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthBar = document.querySelector('.password-strength-progress');
    const strengthText = document.querySelector('.password-strength-text');

    passwordInput?.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;

      if (password.length >= 8) strength += 25;
      if (password.length >= 12) strength += 25;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
      if (/\d/.test(password) && /[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 25;

      strengthBar.style.width = strength + '%';
      strengthBar.className = 'password-strength-progress';

      if (strength <= 25) {
        strengthBar.classList.add('strength-weak');
        strengthText.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> Weak password';
      } else if (strength <= 50) {
        strengthBar.classList.add('strength-fair');
        strengthText.innerHTML = '<i class="bi bi-info-circle me-1"></i> Fair password';
      } else if (strength <= 75) {
        strengthBar.classList.add('strength-good');
        strengthText.innerHTML = '<i class="bi bi-check-circle me-1"></i> Good password';
      } else {
        strengthBar.classList.add('strength-strong');
        strengthText.innerHTML = '<i class="bi bi-shield-check me-1"></i> Strong password';
      }
    });
  </script>
</body>
</html>
