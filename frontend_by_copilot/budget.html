<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets - FinMate</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/custom.css">
  <link rel="stylesheet" href="/src/styles/dashboard.css">

  <style>
    /* Header Styles */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1040;
      background: rgba(15, 18, 22, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem 0;
      pointer-events: auto !important;
    }

    .app-header *,
    .app-header .dropdown,
    .app-header .dropdown-toggle,
    .app-header a,
    .app-header button {
      pointer-events: auto !important;
    }

    .logo-link {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
    }

    .logo {
      transition: opacity 0.2s ease;
      cursor: pointer;
    }

    .logo:hover {
      opacity: 0.8;
    }

    .user-avatar {
      border: 2px solid rgba(58, 160, 255, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .user-avatar:hover {
      border-color: #3aa0ff;
      transform: scale(1.05);
    }

    .dropdown-toggle {
      font-weight: 500;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .dropdown-toggle:hover {
      color: #3aa0ff !important;
    }

    .dropdown-menu {
      background: rgba(20, 25, 30, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      padding: 0.5rem;
      margin-top: 0.5rem;
      z-index: 1050;
    }

    .dropdown-item {
      color: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background: rgba(58, 160, 255, 0.1);
      color: #3aa0ff;
    }

    .dropdown-divider {
      border-color: rgba(255, 255, 255, 0.1);
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ✅ Universal Header -->
    <header class="app-header" id="app-header">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="/dashboard.html" class="logo-link">
          <img src="/img/finmatelogo1.png" alt="FinMate" width="100" class="logo">
        </a>

        <div id="header-user-section">
          <!-- This will be populated by JavaScript -->
          <div class="d-flex align-items-center gap-3" id="auth-controls">
            <a href="/login.html" class="btn btn-outline-primary btn-sm">Login</a>
            <a href="/register.html" class="btn btn-primary btn-sm">Sign up</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="container-fluid px-4 py-4" style="max-width: 1400px; margin-top: 56px;">

    <!-- Page Header -->
    <div class="dashboard-header mb-4">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h2 class="mb-1" style="color: #fff; font-weight: 600;">
            <i class="bi bi-piggy-bank me-2" style="color: #3aa0ff;"></i>
            Budget Management
          </h2>
          <p class="text-muted mb-0">Track and manage your spending limits</p>
        </div>
      </div>
    </div>

    <!-- Budget Limit Progress -->
    <div class="card mb-4" style="background: rgba(20, 25, 30, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0" style="color: rgba(255,255,255,0.9); font-weight: 500;">Budget Limit</h6>
          <span id="budgetLimitText" class="text-muted" style="font-size: 14px;">0 / 5 used</span>
        </div>
        <div class="progress" style="height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px;">
          <div id="budgetLimitBar" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.3s ease;"></div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Left Column - Add/Edit Budget Form -->
      <div class="col-lg-4">
        <div class="card" style="background: rgba(20, 25, 30, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; position: sticky; top: 100px;">
          <div class="card-body p-4">
            <div class="mb-4">
              <h5 class="mb-0" style="color: #fff; font-weight: 600;">
                <i class="bi bi-piggy-bank me-2" style="color: #3aa0ff;"></i>
                Budget
              </h5>
            </div>

            <form id="budgetForm" novalidate>
              <input type="hidden" id="budgetId" value="">

              <!-- Category -->
              <div class="mb-3">
                <label for="budgetCategory" class="form-label" style="color: rgba(255,255,255,0.9); font-weight: 500;">Category</label>
                <select class="form-select form-control-modern" id="budgetCategory">
                  <option value="" disabled selected style="background: #1a1f28; color: rgba(255, 255, 255, 0.8);">Select category...</option>
                </select>
                <div class="form-text mt-1" style="color: rgba(255,255,255,0.75); font-size: 12px;">
                  <i class="bi bi-info-circle me-1"></i>
                  <span id="categoryHint">Choose a category to track spending</span>
                </div>
              </div>

              <!-- Amount -->
              <div class="mb-3">
                <label for="budgetAmount" class="form-label" style="color: rgba(255,255,255,0.9); font-weight: 500;">Budget Amount</label>
                <div class="input-group">
                  <span class="input-group-text" id="currencySymbol" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);">₴</span>
                  <input type="number" class="form-control form-control-modern" id="budgetAmount" placeholder="e.g., 500.00" step="0.01" min="0.01">
                </div>
              </div>

              <!-- Recurring Switch -->
              <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="isRecurring" style="cursor: pointer;">
                <label class="form-check-label" for="isRecurring" style="color: rgba(255,255,255,0.9); cursor: pointer;">
                  <i class="bi bi-arrow-repeat me-1"></i>
                  Recurring Budget
                </label>
                <div class="form-text mt-2" style="color: rgba(255,255,255,0.75); font-size: 12px;">
                  <i class="bi bi-info-circle me-1"></i>
                  Recurring budgets reset on the 1st of every month
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn-modern btn-success-modern w-100">
                <i class="bi bi-check-lg me-2"></i>
                Save Budget
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Right Column - Budgets List -->
      <div class="col-lg-8">
        <div id="budgetsContainer">
          <!-- Budgets will be loaded here -->
          <div class="text-center py-5">
            <div class="spinner-border" role="status" style="color: #3aa0ff;">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div><!-- /.container-fluid -->

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteBudgetModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-delete-transaction">
          <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h5 class="modal-title">
              <i class="bi bi-exclamation-triangle-fill me-2" style="color: #ef4444;"></i>
              Delete Budget?
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p style="color: rgba(255,255,255,0.8);">Are you sure you want to delete this budget? This action cannot be undone.</p>
          </div>
          <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.1);">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
              <i class="bi bi-trash me-1"></i>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /#app -->


  <!-- Main App JS -->
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/pages/budget.js"></script>

</body>
</html>
