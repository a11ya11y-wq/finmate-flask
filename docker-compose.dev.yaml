services:
  db:
    image: postgres:15
    container_name: finmate_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate_admin -d finmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: finmate_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    container_name: finmate_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-main

  certbot:
    profiles: [ "debug" ]
    entrypoint: [ "echo", "Certbot is disabled in dev mode" ]

  api-main:
    image: finmate_api_main
    build: api-main
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./api-main:/app
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

  celery_worker:
    image: finmate_api_main
    build: api-main
    command: celery -A celery_worker.celery worker --pool=solo --loglevel=info
    env_file:
      - .env
    volumes:
      - ./api-main:/app
    depends_on:
      - api-main

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-main

volumes:
   pg_data:
   redis_data: