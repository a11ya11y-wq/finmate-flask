services:
  db:
    image: postgres:15
    container_name: finmate_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate_admin -d finmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: finmate_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    container_name: finmate_gateway
    ports:
      - "80:80" #єдиний вхід у систему
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  backend:
    image: finmate_backend
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

  celery_worker:
    image: finmate-backend
    build: ./backend
    command: celery -A celery_worker.celery worker --pool=solo --loglevel=info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  frontend:
    container_name: finmate_frontend
    build: ./frontend_by_copilot
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
   pg_data:
   redis_data: