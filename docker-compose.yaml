services:
  db:
    image: postgres:15
    container_name: finmate_postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finmate_admin -d finmate_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: finmate_redis
    image: redis:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    container_name: finmate_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - api-main

  certbot:
    image: certbot/certbot
    container_name: finmate_certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  api-main:
    image: ghcr.io/a11ya11y-wq/finmate-api:latest
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app.py
    command: sh -c "gunicorn --bind 0.0.0.0:5000 --workers 3 core_service.wsgi:app"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: ghcr.io/a11ya11y-wq/finmate-api:latest
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  report-service:
    container_name: finmate_report_service
    image: ghcr.io/a11ya11y-wq/finmate-report:latest
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
  frontend:
    container_name: frontend
    image: ghcr.io/a11ya11y-wq/finmate-frontend:latest
    depends_on:
      - api-main

volumes:
  pg_data:
  redis_data:
  certbot-etc:
  certbot-var:
  webroot:
