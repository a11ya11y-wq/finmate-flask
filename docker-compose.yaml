services:
  db:
    image: postgres:15
    container_name: finmate_postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmate_admin -d finmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: finmate_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    container_name: finmate_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-main

  certbot:
    profiles: [ "debug" ]
    entrypoint: [ "echo", "Certbot is disabled in dev mode" ]

  api-main:
    image: finmate_api_main
    build: api-main
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app.py
    command: >
      sh -c "PYTHONPATH=. python3 -m flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 3 core_service.wsgi:app"
    env_file:
      - .env
    depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

  celery_worker:
    image: finmate_api_main
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - api-main

  report-service:
    build: ./services/report-service
    container_name: finmate_report_service
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
#        - ./services/report-service:/app
        - ./shared_reports:/app/uploads

  frontend:
    container_name: frontend
    build: ./frontend
    depends_on:
      - api-main

volumes:
   pg_data:
   redis_data: