services:
  db:
    image: postgres:15
    container_name: finmate_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: finmate_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    container_name: finmate_redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
   pg_data:
   redis_data: