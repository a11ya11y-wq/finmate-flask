name: FinMate CD (Deployment)

on:
  workflow_run:
    workflows: ["FinMate CI (Testing & Reporting)"]
    types: [completed]

jobs:
  build-and-push:
    name: Build and Push Images to GHCR
    # Запускаємо деплой ТІЛЬКИ якщо CI завершився успішно і це був пуш в master
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API & Celery
        uses: docker/build-push-action@v5
        with:
          context: ./api-main
          push: true
          tags: ghcr.io/${{ env.REPO }}-api:latest

      - name: Build and push Report Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/report-service
          target: production
          push: true
          tags: ghcr.io/${{ env.REPO }}-report:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO }}-frontend:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1

  deploy:
    name: Deploy to DigitalOcean
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd /root/finmate-flask
            git pull origin master
            
            docker compose pull
            docker compose down api-main celery_worker report-service frontend
            docker compose up -d db redis
            docker compose run --rm api-main python3 -m flask db upgrade
            docker compose up -d