name: FinMate CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-tests:
    name: Backend Unit Tests (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finmate_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-main/requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests with Pytest
        env:
          FLASK_CONFIG: testing 
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/finmate_db_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.TEST_JWT_SECRET }}
          FLASK_ENV: testing
        run: |
          python -m pytest api-main/tests/ --cov=api-main --cov-report=xml

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for Docker Compose
        run: |
          cat << EOF > .env
          FLASK_CONFIG=testing
          SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.TEST_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.TEST_JWT_SECRET }}
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=password
          POSTGRES_DB=finmate_e2e_db
          DATABASE_URL=postgresql+psycopg://postgres:password@db:5432/finmate_e2e_db
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          CORS_ORIGINS=http://localhost,http://127.0.0.1
          EOF

      - name: Start full application stack
        run: docker compose up -d --build

      - name: Run Database Migrations
        run: docker compose exec -T api-main flask db upgrade

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:5000/api/v1 
        run: npx playwright test

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to DigitalOcean
    needs: e2e-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/finmate-flask
            git pull origin master
            docker compose down api-main celery-worker
            docker compose up -d db redis
            docker compose run --rm api-main flask db upgrade
            docker compose up -d --build